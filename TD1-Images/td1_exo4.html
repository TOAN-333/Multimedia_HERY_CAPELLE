<!DOCTYPE html>
<html>
    <head>
        <!-- voir https://greensock.com/docs/v3/Installation#installer -->
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
            svg { border: 1px solid #ccc; margin: 10px 0; }
        </style>
    </head>
    
    <body>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
        <script>        
            class Voilier {
                constructor(parent, x, y) {
                    this.g = parent.appendElement("g");

                    this.g.setAttributes({ transform: `translate(${x} ${y})` });

                    this.g.appendElement("rect", {
                        x:6, y:0.5, width:0.2, height:5,
                        fill: "grey"
                    });

                    // Coque (coordonnées relatives au point de référence)
                    this.g.appendElement("path", {
                        d: "M9 5 L6 0.5 L4 5 Z",
                        fill: "white", stroke:"black", "stroke-width":0.01
                    });

                    this.g.appendElement("path", {
                        d: "M9 5 L3 5.3 L3 6.5 L8 6.5 Z",
                        fill: "darkred"
                    });
                }
            }

            class Paysage {
                constructor(parent) {
                    // groupe pour le paysage
                    const g = parent.appendElement("g");

                    // Fond
                    g.appendElement("rect", {
                        x: 0, y: 0, width: 16, height: 9,
                        fill: "#DFF"
                    });

                    g.appendElement("circle", {
                        cx: 13, cy: 1.5, r: 1,
                        fill: "yellow"
                    });

                    g.appendElement("rect", {
                        x: 0, y: 6, width:16, height:3,
                        fill: "blue"
                    });

                    // Voilier
                    const voilier = new Voilier(g, 0, 0);

                    gsap.to(voilier.g, {
                        x: 6,
                        y: 5,
                        duration: 4,
                        ease: "power1.inOut"
                    });
                }
            }

            // Initialisation quand la page est prête
            document.addEventListener('DOMContentLoaded', function() {
                const svg = SVGelement.fromSelector("#dessin-demo");
                if (svg) {
                    new Paysage(svg);
                }
            });
        </script>

        <div style="text-align: center; margin: 20px 0;">
            <h3>Démo Interactive - Paysage généré par JavaScript</h3>
            <svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 16 9" id="dessin-demo" style="border: 1px solid #333;">
            </svg>
        </div>
        <script src="svgelement.js"></script>
    </body>
</html>
